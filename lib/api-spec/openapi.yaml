openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: generation
    description: Video generation and reference operations
  - name: gallery
    description: Community gallery operations
  - name: history
    description: User generation history
  - name: video
    description: Video scene planning and generation jobs
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /generate-scene:
    post:
      operationId: generateScene
      tags: [generation]
      summary: Generate an anime scene from a prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneGenerationInput"
      responses:
        "200":
          description: Generated scene
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationResult"
        "400":
          description: Invalid input
  /convert-sketch:
    post:
      operationId: convertSketch
      tags: [generation]
      summary: Convert a sketch into an anime character
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SketchConversionInput"
      responses:
        "200":
          description: Converted character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationResult"
        "400":
          description: Invalid input
  /character-references:
    post:
      operationId: registerCharacterReference
      tags: [video]
      summary: Register a character reference for a video scene
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterReferenceInput"
      responses:
        "200":
          description: Character reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterReference"
        "400":
          description: Invalid reference
  /generate-video:
    post:
      operationId: generateVideo
      tags: [video]
      summary: Plan and queue a minimum 60-second anime video scene
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoGenerationInput"
      responses:
        "200":
          description: Video generation job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoJob"
        "400":
          description: Invalid input
  /video-jobs/{id}:
    get:
      operationId: getVideoJob
      tags: [video]
      summary: Get a video generation job and storyboard
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Video generation job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoJob"
        "404":
          description: Job not found
  /upload:
    post:
      operationId: uploadAsset
      tags: [generation]
      summary: Register an uploaded sketch asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadInput"
      responses:
        "200":
          description: Uploaded asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
  /gallery:
    get:
      operationId: getGallery
      tags: [gallery]
      summary: Get student gallery posts
      responses:
        "200":
          description: Gallery posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GalleryPost"
  /gallery/{id}/like:
    post:
      operationId: likeGalleryPost
      tags: [gallery]
      summary: Like a gallery post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated gallery post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryPost"
        "404":
          description: Post not found
  /history:
    get:
      operationId: getHistory
      tags: [history]
      summary: Get recent generation history
      responses:
        "200":
          description: Generation history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoryItem"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SceneGenerationInput:
      type: object
      properties:
        prompt:
          type: string
          minLength: 3
        style:
          type: string
        aspectRatio:
          type: string
      required: [prompt, style, aspectRatio]
    SketchConversionInput:
      type: object
      properties:
        assetId:
          type: string
        prompt:
          type: string
        fidelity:
          type: integer
          minimum: 0
          maximum: 100
        colorIntensity:
          type: integer
          minimum: 0
          maximum: 100
      required: [assetId, prompt, fidelity, colorIntensity]
    UploadInput:
      type: object
      properties:
        fileName:
          type: string
        mimeType:
          type: string
        dataUrl:
          type: string
      required: [fileName, mimeType, dataUrl]
    UploadResult:
      type: object
      properties:
        assetId:
          type: string
        fileName:
          type: string
        previewUrl:
          type: string
      required: [assetId, fileName, previewUrl]
    CharacterReferenceInput:
      type: object
      properties:
        characterName:
          type: string
          minLength: 1
        fileName:
          type: string
        mimeType:
          type: string
        dataUrl:
          type: string
        notes:
          type: string
      required: [characterName, fileName, mimeType, dataUrl]
    CharacterReference:
      type: object
      properties:
        assetId:
          type: string
        characterName:
          type: string
        fileName:
          type: string
        previewUrl:
          type: string
        notes:
          type: string
      required: [assetId, characterName, fileName, previewUrl, notes]
    VideoGenerationInput:
      type: object
      properties:
        prompt:
          type: string
          minLength: 40
        durationSeconds:
          type: integer
          minimum: 60
          maximum: 300
        aspectRatio:
          type: string
          enum: [16:9, 9:16, 1:1]
        style:
          type: string
          minLength: 1
        cameraMovement:
          type: string
          minLength: 1
        characterReferenceIds:
          type: array
          items:
            type: string
          maxItems: 4
      required: [prompt, durationSeconds, aspectRatio, style, cameraMovement]
    StoryboardShot:
      type: object
      properties:
        shotNumber:
          type: integer
        startSeconds:
          type: integer
        durationSeconds:
          type: integer
        framing:
          type: string
        cameraMovement:
          type: string
        action:
          type: string
        continuity:
          type: string
      required: [shotNumber, startSeconds, durationSeconds, framing, cameraMovement, action, continuity]
    VideoJob:
      type: object
      properties:
        id:
          type: integer
        prompt:
          type: string
        durationSeconds:
          type: integer
        aspectRatio:
          type: string
        style:
          type: string
        cameraMovement:
          type: string
        characterReferenceIds:
          type: array
          items:
            type: string
        storyboard:
          type: array
          items:
            $ref: "#/components/schemas/StoryboardShot"
        status:
          type: string
          enum: [provider_unavailable, queued, processing, complete, failed]
        provider:
          type: string
        outputUrl:
          type: string
          nullable: true
        message:
          type: string
        createdAt:
          type: string
      required: [id, prompt, durationSeconds, aspectRatio, style, cameraMovement, characterReferenceIds, storyboard, status, provider, message, createdAt]
    GenerationResult:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
        prompt:
          type: string
        style:
          type: string
        aspectRatio:
          type: string
        imageUrl:
          type: string
        thumbnailUrl:
          type: string
        createdAt:
          type: string
        status:
          type: string
      required: [id, kind, prompt, style, aspectRatio, imageUrl, thumbnailUrl, createdAt, status]
    GalleryPost:
      type: object
      properties:
        id:
          type: integer
        imageUrl:
          type: string
        title:
          type: string
        creatorName:
          type: string
        prompt:
          type: string
        likes:
          type: integer
        style:
          type: string
      required: [id, imageUrl, title, creatorName, prompt, likes, style]
    HistoryItem:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
        prompt:
          type: string
        imageUrl:
          type: string
        createdAt:
          type: string
        status:
          type: string
      required: [id, kind, prompt, imageUrl, createdAt, status]

